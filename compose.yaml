services:
  katya-viewbot:
    image: katya-viewbot:local
    build: .
    init: true
    restart: unless-stopped
    shm_size: 512m
    ports:
      - "${KATYA_BIND_IP:-127.0.0.1}:${KATYA_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
